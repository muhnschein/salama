# TEMPORARY DIAGNOSTIC -- reverted before the PR.
name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    name: diag ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain
        run: |
          ci/apt-install.sh \
            cmake g++ make \
            qtbase5-dev qtbase5-dev-tools qtdeclarative5-dev qtdeclarative5-dev-tools \
            qttools5-dev-tools libqt5sql5-sqlite \
            qml-module-qtquick2 qml-module-qtqml qml-module-qtquick-window2 qml-module-qttest
      - name: Build
        run: |
          nproc; cat /proc/cpuinfo | grep "model name" | head -1
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DSALAMA_COVERAGE=ON
          cmake --build build -j "$(nproc)" --target tst_qmlload
      - name: Loop
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          fails=0
          for i in 1 2 3 4; do
            build/tests/tst_qmlload -maxwarnings 0 > full.log 2>&1 || fails=$((fails+1))
            echo "full $i rc=$?"
            grep -E "DIAG|^FAIL|Loc:|Totals" full.log | cut -c1-600
          done
          for i in $(seq 1 40); do
            build/tests/tst_qmlload cover coverWithNothingToSay coverShowsDownloads coverShowsWhatPlays > sub.log 2>&1 || { fails=$((fails+1)); grep -E "DIAG|^FAIL|Loc:" sub.log | cut -c1-600; }
          done
          grep -h "DIAG never\|DIAG slow" full.log sub.log || true
          echo "fails=$fails"
