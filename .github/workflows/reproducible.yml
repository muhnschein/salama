# Reproducibility drift between releases (rpm.yml's `reproduce` gates only releases). Red:
# commit no longer rebuilds byte for byte; log lists what differs. Weekly on main: Jolla's
# repos feed BuildRequires each build, can change without commit here. On PRs touching
# packaging: change proves itself before merge.
#
# Docker build on one runner, Podman rebuild on another at same time, other time zone and
# umask; small job compares. Same as release gate. Rebuilt twice: in pinned image
# (piirit's derived one, ci/sdk-images) and in upstream image it derives from, so
# pinned image provably changes nothing in package (docs/VERIFYING.md).
name: reproducible

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - "rpm/**"
      - "ci/build-in-container.sh"
      - "ci/container-engine.sh"
      - "ci/verify-release.sh"
      - "ci/sdk-images"
      - "CMakeLists.txt"
      - "**/CMakeLists.txt"
      - ".github/workflows/rpm.yml"
      - ".github/workflows/reproducible.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# PR: head commit, not GitHub's merge commit; that one is on no branch, a fresh clone
# can't check it out. Fork PRs: head not in this repo, check fails to clone.
env:
  SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  build:
    name: Build with Docker
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
      - run: ci/build-in-container.sh
        env:
          SALAMA_ENGINE: docker
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: repro-build
          path: RPMS/harbour-salama-*.rpm
          if-no-files-found: error
          retention-days: 7

  # Beside `build`, not after: needs its package only to compare (`compare`).
  rebuild:
    name: Rebuild with Podman (${{ matrix.sdk }} SDK)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - sdk: pinned
            image: ""
          # piirit's ci/build-sdk-image.sh derives pinned image from this digest.
          - sdk: upstream
            image: docker.io/coderus/sailfishos-platform-sdk@sha256:e7c4379393b17ee63d7f7443ce9930c315a61fdb2e732016346ccbe8c934435e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Make room
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet \
                      "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}"
      # Upstream image's build user is uid 100000: beyond runner's 65536 subordinate ids
      # (docs/VERIFYING.md). Pinned one's is 1000.
      - name: Widen the subordinate id range
        if: matrix.sdk == 'upstream'
        run: |
          sudo sed -i "s/^$(id -un):.*/$(id -un):165536:1000000/" /etc/subuid /etc/subgid
          podman system migrate
      - name: Rebuild from a fresh clone
        env:
          SALAMA_ENGINE: podman
          SALAMA_SDK_IMAGE: ${{ matrix.image }}
          TZ: Pacific/Chatham
        run: |
          umask 0002
          mkdir -p reproduced
          SALAMA_REPO="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" \
            ci/verify-release.sh --no-download --ref "$SHA" --save reproduced/reproduced.rpm
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reproduced-${{ matrix.sdk }}
          path: reproduced/reproduced.rpm
          if-no-files-found: error
          retention-days: 7

  compare:
    name: Compare byte for byte (${{ matrix.sdk }} SDK)
    needs: [build, rebuild]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        sdk: [pinned, upstream]
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
      - name: Fetch both packages
        env:
          SDK: ${{ matrix.sdk }}
        run: |
          gh run download "$GITHUB_RUN_ID" -n repro-build --dir rpms
          gh run download "$GITHUB_RUN_ID" -n "reproduced-$SDK" --dir rpms
      # Identical: done in seconds. Different: unpacks both in SDK image to say what differs.
      - name: Compare
        env:
          SALAMA_ENGINE: docker
        run: |
          rpm=$(find rpms -name 'harbour-salama-*.rpm' ! -name '*debug*' ! -name '*.src.rpm' | head -1)
          [ -n "$rpm" ] || { echo "::error::no device RPM to check"; exit 1; }
          ci/verify-release.sh --no-download --rpm "$rpm" --ref "$SHA" --rebuilt rpms/reproduced.rpm
