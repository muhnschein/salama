# SonarQube Cloud analysis.
#
# Out of ci.yml on purpose: ci.yml is GATE (`make check`; green laptop = green CI,
# SCOPE.md §6). This is REPORT: can't fail change. Hosted service in gate would break
# "laptop enough" rule.
#
# Imports (coverage, compile DB) come from `make sonar-reports`, same as local.
# sonar-project.properties says why scanner doesn't make them.
name: sonar

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

# Read-only. SonarQube Cloud decorates PRs via own GitHub App.
permissions:
  contents: read

concurrency:
  group: sonar-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sonar:
    name: SonarQube Cloud
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Fork PRs get no secrets: empty SONAR_TOKEN -> confusing auth failure. Skip;
    # merge gets analysed on main.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Sonar reads git blame for new code; shallow clone makes every line new.
          fetch-depth: 0

      # Same set as ci.yml: `make sonar-reports` runs full suite incl. QML load tests.
      - name: Install toolchain
        run: |
          ci/apt-install.sh \
            cmake g++ make clang-format clang-tidy \
            qtbase5-dev qtbase5-dev-tools qtdeclarative5-dev qtdeclarative5-dev-tools \
            qttools5-dev-tools libqt5sql5-sqlite \
            qml-module-qtquick2 qml-module-qtqml qml-module-qtquick-window2 qml-module-qttest \
            gcovr shellcheck desktop-file-utils rpm file

      - name: make sonar-reports
        run: make sonar-reports

      # Version from spec (sonar-project.properties says why).
      - name: Read the version
        id: version
        run: |
          version=$(sed -n 's/^Version:[[:space:]]*//p' rpm/harbour-salama.spec)
          [[ $version =~ ^[0-9.]+$ ]] || {
            echo "::error::version '$version' must be digits and periods"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "analysing version $version"

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        # SONAR_HOST_URL unset = SonarQube Cloud; self-hosted Server needs it.
        with:
          args: >
            -Dsonar.projectVersion=${{ steps.version.outputs.version }}

      # Scan uploads and exits; server processes later. This prints gate, ratings,
      # issues into job log. continue-on-error, never `sonar.qualitygate.wait`:
      # report, not gate. Outage = warning.
      - name: What SonarQube made of it
        if: always()
        continue-on-error: true
        env:
          # Private project only; public endpoints readable without.
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ci/sonar-report.sh
