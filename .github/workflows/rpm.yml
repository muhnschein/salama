# Device RPM: cross-compile for aarch64 in Sailfish platform SDK image, run Jolla's
# validator. Same as postivene's rpm.yml minus Rust; releases as piirit/vuo: workflow
# publishes what it built (docs/RELEASING.md), once a second build matched it byte for
# byte (docs/VERIFYING.md).
#
# Not in ci.yml: multi-GB image, minutes of runner time. Run from Actions tab; release via
# main dispatch with `release` or `v*` tag; `build-*` tag builds branch before this file
# reaches default branch (workflow_dispatch only sees workflows there).
#
# Actions pinned to commits: tags can be repointed.
name: rpm

on:
  workflow_dispatch:
    inputs:
      sfos_version:
        description: >
          Sailfish SDK release to build against. 5.2.0.15 is the Jolla Phone 2026
          baseline and the floor this project supports; Harbour also requires the
          __libc_start_main@GLIBC_2.34 that only a 5.x SDK links.
        type: string
        default: "5.2.0.15"
      release:
        description: >
          Cut a release: the version to publish, which has to be what
          rpm/harbour-salama.spec says, run on main. The commit is tagged
          v<version> and a GitHub release goes up with the package and
          docs/CHANGELOG.md's section for it. Leave empty for an ordinary
          build. See docs/RELEASING.md.
        type: string
        default: ""
      rehearse:
        description: >
          Rehearse a release on this branch: build as the release would, rebuild
          it on a second runner and compare, but tag and publish nothing.
        type: boolean
        default: false
  push:
    tags: ["v*", "build-*"]

# Build only reads tree; release job holds more, build never does.
permissions:
  contents: read

jobs:
  rpm:
    name: aarch64 RPM + Harbour validation
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ARCH: aarch64
      SFOS: ${{ inputs.sfos_version || '5.2.0.15' }}
      # Dispatch free text: via env, never spliced into script; checked vs spec Version first.
      RELEASE: ${{ inputs.release || '' }}
      REHEARSE: ${{ inputs.rehearse && '1' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Version = spec's. Release = `v*` tag or main dispatch with `release`; must match
      # spec, else package and release page disagree. Dispatch limited to main: release
      # job tags that commit. Runs first so mistake costs seconds, not SDK pull.
      #
      # Release and its rehearsal build spec as committed (Release: 1, what Harbour
      # gets; `reproduce` rebuilds that). Others get
      # 1.<run number> so each upgrades previous (rpm -U, pkcon skip known NEVRA).
      # Digits and periods only (Harbour).
      - name: Stamp the release
        run: |
          version=$(sed -n 's/^Version:[[:space:]]*//p' rpm/harbour-salama.spec)
          [[ $version =~ ^[0-9.]+$ ]] || {
            echo "::error::version '$version' must be digits and periods"; exit 1; }
          wanted=""
          case "$GITHUB_REF" in refs/tags/v*) wanted=${GITHUB_REF#refs/tags/v} ;; esac
          if [ -n "$RELEASE" ]; then
            [ "$GITHUB_REF" = "refs/heads/main" ] || {
              echo "::error::a release is cut on main, not on $GITHUB_REF"; exit 1; }
            wanted=$RELEASE
          fi
          if [ -n "$wanted" ]; then
            [ "$wanted" = "$version" ] || {
              echo "::error::release $wanted, but rpm/harbour-salama.spec says Version: $version"
              exit 1; }
            ci/release-notes.sh "$version" >/dev/null || {
              echo "::error::docs/CHANGELOG.md has no '## [$version]' section to release"
              exit 1; }
            release=1
          elif [ -n "$REHEARSE" ]; then
            release=1
          else
            release="1.${GITHUB_RUN_NUMBER}"
          fi
          sed -i "s/^Release:.*/Release:    $release/" rpm/harbour-salama.spec
          grep -E '^(Version|Release):' rpm/harbour-salama.spec
          echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      # Same script as local build, so the two can't drift (its comments say why). Image
      # pinned in ci/sdk-images. Docker here; `reproduce` rebuilds with Podman.
      - name: Build the RPM
        env:
          SALAMA_ENGINE: docker
        run: ci/build-in-container.sh "$SFOS"

      - name: Show mb2's state
        if: failure()
        run: ls -la .mb2 2>/dev/null || true; tail -60 .mb2/*.log 2>/dev/null || true

      - name: Install rpm tooling on the runner
        run: ci/apt-install.sh binutils rpm rpm2cpio cpio file

      - name: Show what was built
        run: find RPMS -name '*.rpm' -print -exec rpm -qip {} \;

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: harbour-salama-${{ env.ARCH }}-sfos${{ env.SFOS }}-${{ env.SHORT_SHA }}
          path: RPMS/**/*.rpm
          if-no-files-found: error
          retention-days: 30

      # Authority. Only built package shows generated Requires/Provides, stripped
      # symbols, real file modes. After upload on purpose: rejected package still
      # useful on phone.
      - name: Validate the RPM against Harbour's rules
        run: |
          rpm=$(find RPMS -name 'harbour-salama-*.rpm' ! -name '*debug*' ! -name '*.src.rpm' | head -1)
          [ -n "$rpm" ] || { echo "::error::no RPM to validate"; exit 1; }
          echo "Validating $rpm"
          ci/harbour-validate-rpm.sh "$rpm"

  # Release gate: fresh clone of same commit, rebuilt the way docs/VERIFYING.md tells users
  # (ci/verify-release.sh), on another runner, with Podman not Docker, another time zone
  # and umask. Not byte-identical: no release. Users' check is then one CI already passed.
  #
  # Beside `rpm`, not after: needs that package only to compare (`compare`). Release waits
  # for slower of two builds, not their sum.
  reproduce:
    name: Rebuild from a fresh clone
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release != '' || inputs.rehearse
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # SDK image unpacks to ~7 GB; runner's spare toolchains make room. Its build user is
      # uid 1000: no subordinate id widening (docs/VERIFYING.md).
      - name: Make room
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet \
                      "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}"

      - name: Rebuild
        env:
          SALAMA_ENGINE: podman
          SALAMA_SFOS: ${{ inputs.sfos_version || '5.2.0.15' }}
          TZ: Pacific/Chatham
        run: |
          umask 0002
          mkdir -p reproduced
          SALAMA_REPO="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" \
            ci/verify-release.sh --no-download --ref "$GITHUB_SHA" \
              --save reproduced/reproduced.rpm

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reproduced
          path: reproduced/reproduced.rpm
          if-no-files-found: error
          retention-days: 30

  # Release package against rebuild, verify-release.sh's own comparison: byte for byte,
  # else what differs inside. Own job: holds no write.
  compare:
    name: Rebuild byte for byte
    needs: [rpm, reproduce]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch both packages
        run: |
          gh run download "$GITHUB_RUN_ID" --dir rpms --pattern 'harbour-salama-*'
          gh run download "$GITHUB_RUN_ID" --dir rpms --name reproduced

      # Identical: done in seconds. Different: unpacks both in SDK image to say what differs.
      - name: Compare
        env:
          SALAMA_ENGINE: docker
          SALAMA_SFOS: ${{ inputs.sfos_version || '5.2.0.15' }}
        run: |
          rpm=$(find rpms -name 'harbour-salama-*.rpm' ! -name '*debug*' \
                     ! -name '*.src.rpm' | head -1)
          [ -n "$rpm" ] || { echo "::error::no device RPM to check"; exit 1; }
          ci/verify-release.sh --no-download --rpm "$rpm" --ref "$GITHUB_SHA" \
            --rebuilt rpms/reproduced.rpm

  # Release: built package on GitHub release v<version>, text = version's
  # docs/CHANGELOG.md section. Own job so `contents: write` never reaches privileged
  # third-party SDK build. Needs build, which ends with validator: rejected package gets
  # no release; and `compare`: package nobody can rebuild gets none either.
  #
  # `v*` tag: tag exists, `--verify-tag` won't invent one. Dispatch: release creates tag
  # on checked-out commit, so tag, release, RPM = one commit. Existing release is added
  # to, so re-run finishes after transient failure. Runner's own `gh`, job token.
  release:
    name: GitHub release
    needs: [rpm, compare]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE: ${{ inputs.release || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch the package this run built
        run: gh run download "$GITHUB_RUN_ID" --dir rpms --pattern 'harbour-salama-*'

      # Device RPM + checksum only; debug/source RPMs are for developers.
      - name: Gather the assets
        run: |
          mkdir -p assets
          find rpms -name 'harbour-salama-*.rpm' ! -name '*debug*' \
               ! -name '*.src.rpm' -exec cp {} assets/ \;
          [ -n "$(ls assets)" ] || { echo "::error::no device RPM to release"; exit 1; }
          (cd assets && sha256sum -- * > SHA256SUMS)
          cat assets/SHA256SUMS

      - name: Publish the release
        run: |
          if [ -n "$RELEASE" ]; then
            version=$RELEASE
            where=(--target "$GITHUB_SHA")
          else
            version=${GITHUB_REF_NAME#v}
            where=(--verify-tag)
          fi
          ci/release-notes.sh "$version" > notes.md
          if gh release view "v$version" >/dev/null 2>&1; then
            gh release upload "v$version" assets/* --clobber
          else
            gh release create "v$version" "${where[@]}" \
              --title "salama $version" \
              --notes-file notes.md \
              assets/*
          fi
