# Device RPM: cross-compiles harbour-salama for aarch64 inside the Sailfish platform
# SDK image and runs Jolla's validator on the result. Step for step the same as
# postivene's rpm.yml, minus its Rust plumbing; a release is cut the way piirit's and
# vuo's are, by this workflow publishing the package it built (docs/RELEASING.md).
#
# Not part of ci.yml: the image is multi-gigabyte and the build is minutes of runner
# time nobody wants on every push. Run it from the Actions tab, dispatch it on main with
# `release` or push a `v*` tag for a release, or a `build-*` tag to build a branch
# before this file reaches the default branch (workflow_dispatch only sees workflows
# that are there).
#
# Every action is pinned to a commit: a tag can be repointed.
name: rpm

on:
  workflow_dispatch:
    inputs:
      sfos_version:
        description: >
          Sailfish SDK release to build against. 5.2.0.15 is the Jolla Phone 2026
          baseline and the floor this project supports; Harbour also requires the
          __libc_start_main@GLIBC_2.34 that only a 5.x SDK links.
        type: string
        default: "5.2.0.15"
      release:
        description: >
          Cut a release: the version to publish, which has to be what
          rpm/harbour-salama.spec says, run on main. The commit is tagged
          v<version> and a GitHub release goes up with the package and
          docs/CHANGELOG.md's section for it. Leave empty for an ordinary
          build. See docs/RELEASING.md.
        type: string
        default: ""
  push:
    tags: ["v*", "build-*"]

# Reading the tree is all the build needs; the release job says what more it holds, so
# the build never holds it.
permissions:
  contents: read

jobs:
  rpm:
    name: aarch64 RPM + Harbour validation
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ARCH: aarch64
      SFOS: ${{ inputs.sfos_version || '5.2.0.15' }}
      # Free text from the dispatch form: read through the environment, never spliced
      # into a script, and held to the spec's Version before anything uses it.
      RELEASE: ${{ inputs.release || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The version is the spec's. A release is a `v*` tag, or a dispatch on main with
      # the version in `release`; either has to say what the spec says, or the package
      # would carry one version and the release page another, and a dispatch is held to
      # main because the release job tags the commit it runs on. First, so a mistake
      # costs seconds rather than an SDK pull.
      #
      # A release builds the spec as committed, Release: 1, the file Harbour is given.
      # Any other build is 1.<run number>, so each is an upgrade of the one before:
      # rpm -U and pkcon do nothing for a package whose NEVRA they already have. Digits
      # and periods only, which is all Harbour accepts in either field.
      - name: Stamp the release
        run: |
          version=$(sed -n 's/^Version:[[:space:]]*//p' rpm/harbour-salama.spec)
          [[ $version =~ ^[0-9.]+$ ]] || {
            echo "::error::version '$version' must be digits and periods"; exit 1; }
          wanted=""
          case "$GITHUB_REF" in refs/tags/v*) wanted=${GITHUB_REF#refs/tags/v} ;; esac
          if [ -n "$RELEASE" ]; then
            [ "$GITHUB_REF" = "refs/heads/main" ] || {
              echo "::error::a release is cut on main, not on $GITHUB_REF"; exit 1; }
            wanted=$RELEASE
          fi
          if [ -n "$wanted" ]; then
            [ "$wanted" = "$version" ] || {
              echo "::error::release $wanted, but rpm/harbour-salama.spec says Version: $version"
              exit 1; }
            ci/release-notes.sh "$version" >/dev/null || {
              echo "::error::docs/CHANGELOG.md has no '## [$version]' section to release"
              exit 1; }
            release=1
          else
            release="1.${GITHUB_RUN_NUMBER}"
          fi
          sed -i "s/^Release:.*/Release:    $release/" rpm/harbour-salama.spec
          grep -E '^(Version|Release):' rpm/harbour-salama.spec
          echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      # By digest, not tag: the image is a third party's and runs privileged with the
      # checkout mounted read-write. To add a release, pull its tag once, read
      # `docker inspect --format '{{index .RepoDigests 0}}'`, add a line here.
      - name: Resolve the SDK image
        run: |
          [[ $SFOS =~ ^[0-9]+(\.[0-9]+){3}$ ]] || {
            echo "::error::sfos_version '$SFOS' is not a dotted version"; exit 1; }
          case "$SFOS" in
            5.2.0.15) digest=sha256:e7c4379393b17ee63d7f7443ce9930c315a61fdb2e732016346ccbe8c934435e ;;
            *) echo "::error::no pinned digest for coderus/sailfishos-platform-sdk:$SFOS; add one to rpm.yml"
               exit 1 ;;
          esac
          echo "IMAGE=coderus/sailfishos-platform-sdk@$digest" >> "$GITHUB_ENV"

      - name: Pull the Sailfish SDK
        run: docker pull "$IMAGE"

      # The image names one target per architecture; asked for rather than assumed so
      # a release whose naming differs fails here with the list, not inside rpmbuild.
      - name: Resolve the build target
        run: |
          targets=$(docker run --rm "$IMAGE" sb2-config -l 2>/dev/null || true)
          echo "available targets:"; echo "$targets"
          target=$(echo "$targets" | grep -- "-$ARCH\$" | tail -1)
          if [ -z "$target" ]; then
            echo "::error::no $ARCH target in the $SFOS SDK image; see the list above"
            exit 1
          fi
          echo "Building against $target"
          echo "TARGET=$target" >> "$GITHUB_ENV"

      # sdk-manage refuses to run as root, so the build runs as the image's own user and
      # the checkout must belong to it. The tree is mounted inside that user's home:
      # rpm runs under scratchbox2, which maps unknown absolute paths into the target
      # rootfs, so a tree at /build is written outside and read inside.
      - name: Hand the checkout to the SDK's build user
        run: |
          uid=$(docker run --rm "$IMAGE" id -u)
          gid=$(docker run --rm "$IMAGE" id -g)
          home=$(docker run --rm "$IMAGE" sh -c 'echo $HOME')
          echo "SDK builds as uid=$uid gid=$gid, HOME=$home"
          echo "BUILDDIR=$home/harbour-salama" >> "$GITHUB_ENV"
          sudo chown -R "$uid:$gid" "$PWD"

      # `-X`: without it build-init asks `git describe` for a version, finds no tag and
      # stops before writing .mb2/spec. build-requires installs the spec's BuildRequires
      # into the target from the Jolla repositories, which a runner can reach. The C++
      # build runs parallel make (%{_smp_mflags}) on the runner's cores.
      - name: Build the RPM
        run: |
          docker run --rm --privileged \
            -e TARGET \
            -v "$PWD:$BUILDDIR" -w "$BUILDDIR" \
            "$IMAGE" \
            /bin/bash -c 'set -e
              mb2 -t "$TARGET" -X build-init
              mb2 -t "$TARGET" -X build-requires ||
                echo "::warning::mb2 build-requires failed; the build may stop on a missing BuildRequires"
              mb2 -t "$TARGET" -X build --no-check'

      - name: Show mb2's state
        if: failure()
        run: ls -la .mb2 2>/dev/null || true; tail -60 .mb2/*.log 2>/dev/null || true

      - name: Take the tree back
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" "$PWD"

      - name: Install rpm tooling on the runner
        run: ci/apt-install.sh binutils rpm rpm2cpio cpio file

      - name: Show what was built
        run: find RPMS -name '*.rpm' -print -exec rpm -qip {} \;

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: harbour-salama-${{ env.ARCH }}-sfos${{ env.SFOS }}-${{ env.SHORT_SHA }}
          path: RPMS/**/*.rpm
          if-no-files-found: error
          retention-days: 30

      # The authority. ci/harbour-check.sh answers the same questions from the sources
      # on every pull request; only this sees the built package: the generated Requires
      # and Provides, the stripped binary's symbols, the real file modes. After the
      # upload on purpose: a package Harbour would reject is still worth a phone.
      - name: Validate the RPM against Harbour's rules
        run: |
          rpm=$(find RPMS -name 'harbour-salama-*.rpm' ! -name '*debug*' ! -name '*.src.rpm' | head -1)
          [ -n "$rpm" ] || { echo "::error::no RPM to validate"; exit 1; }
          echo "Validating $rpm"
          ci/harbour-validate-rpm.sh "$rpm"

  # A release: the package the job above built goes on a GitHub release named
  # v<version>, with that version's section of docs/CHANGELOG.md as its text. Its own
  # job so that `contents: write` is held only here, by a few commands, and never by
  # the build running a third party's SDK image with `--privileged`. It needs the
  # build, and the build ends with Jolla's validator, so a package Harbour would
  # reject never gets a release page.
  #
  # From a `v*` tag the tag is there already and `--verify-tag` refuses to invent one;
  # from a dispatch the release is what makes the tag, on the commit this run checked
  # out, so the tag, the release and the RPM are one commit by construction. A release
  # that is already there is added to rather than refused, so re-running this job
  # after a transient failure finishes it. `gh` is the runner's own, so there is no
  # third-party tag to repoint; the token is the job's.
  release:
    name: GitHub release
    needs: rpm
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE: ${{ inputs.release || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch the package this run built
        run: gh run download "$GITHUB_RUN_ID" --dir rpms

      # The device package and its checksum, and nothing else: the debug and source
      # RPMs are for a developer with the tree, not a phone.
      - name: Gather the assets
        run: |
          mkdir -p assets
          find rpms -name 'harbour-salama-*.rpm' ! -name '*debug*' \
               ! -name '*.src.rpm' -exec cp {} assets/ \;
          [ -n "$(ls assets)" ] || { echo "::error::no device RPM to release"; exit 1; }
          (cd assets && sha256sum -- * > SHA256SUMS)
          cat assets/SHA256SUMS

      - name: Publish the release
        run: |
          if [ -n "$RELEASE" ]; then
            version=$RELEASE
            where=(--target "$GITHUB_SHA")
          else
            version=${GITHUB_REF_NAME#v}
            where=(--verify-tag)
          fi
          ci/release-notes.sh "$version" > notes.md
          if gh release view "v$version" >/dev/null 2>&1; then
            gh release upload "v$version" assets/* --clobber
          else
            gh release create "v$version" "${where[@]}" \
              --title "salama $version" \
              --notes-file notes.md \
              assets/*
          fi
