# Device RPM: cross-compile for aarch64 in Sailfish platform SDK image, run Jolla's
# validator. Same as postivene's rpm.yml minus Rust; releases as piirit/vuo: workflow
# publishes what it built (docs/RELEASING.md).
#
# Not in ci.yml: multi-GB image, minutes of runner time. Run from Actions tab; release via
# main dispatch with `release` or `v*` tag; `build-*` tag builds branch before this file
# reaches default branch (workflow_dispatch only sees workflows there).
#
# Actions pinned to commits: tags can be repointed.
name: rpm

on:
  workflow_dispatch:
    inputs:
      sfos_version:
        description: >
          Sailfish SDK release to build against. 5.2.0.15 is the Jolla Phone 2026
          baseline and the floor this project supports; Harbour also requires the
          __libc_start_main@GLIBC_2.34 that only a 5.x SDK links.
        type: string
        default: "5.2.0.15"
      release:
        description: >
          Cut a release: the version to publish, which has to be what
          rpm/harbour-salama.spec says, run on main. The commit is tagged
          v<version> and a GitHub release goes up with the package and
          docs/CHANGELOG.md's section for it. Leave empty for an ordinary
          build. See docs/RELEASING.md.
        type: string
        default: ""
  push:
    tags: ["v*", "build-*"]

# Build only reads tree; release job holds more, build never does.
permissions:
  contents: read

jobs:
  rpm:
    name: aarch64 RPM + Harbour validation
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ARCH: aarch64
      SFOS: ${{ inputs.sfos_version || '5.2.0.15' }}
      # Dispatch free text: via env, never spliced into script; checked vs spec Version first.
      RELEASE: ${{ inputs.release || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Version = spec's. Release = `v*` tag or main dispatch with `release`; must match
      # spec, else package and release page disagree. Dispatch limited to main: release
      # job tags that commit. Runs first so mistake costs seconds, not SDK pull.
      #
      # Release builds spec as committed (Release: 1, what Harbour gets). Others get
      # 1.<run number> so each upgrades previous (rpm -U, pkcon skip known NEVRA).
      # Digits and periods only (Harbour).
      - name: Stamp the release
        run: |
          version=$(sed -n 's/^Version:[[:space:]]*//p' rpm/harbour-salama.spec)
          [[ $version =~ ^[0-9.]+$ ]] || {
            echo "::error::version '$version' must be digits and periods"; exit 1; }
          wanted=""
          case "$GITHUB_REF" in refs/tags/v*) wanted=${GITHUB_REF#refs/tags/v} ;; esac
          if [ -n "$RELEASE" ]; then
            [ "$GITHUB_REF" = "refs/heads/main" ] || {
              echo "::error::a release is cut on main, not on $GITHUB_REF"; exit 1; }
            wanted=$RELEASE
          fi
          if [ -n "$wanted" ]; then
            [ "$wanted" = "$version" ] || {
              echo "::error::release $wanted, but rpm/harbour-salama.spec says Version: $version"
              exit 1; }
            ci/release-notes.sh "$version" >/dev/null || {
              echo "::error::docs/CHANGELOG.md has no '## [$version]' section to release"
              exit 1; }
            release=1
          else
            release="1.${GITHUB_RUN_NUMBER}"
          fi
          sed -i "s/^Release:.*/Release:    $release/" rpm/harbour-salama.spec
          grep -E '^(Version|Release):' rpm/harbour-salama.spec
          echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      # Digest, not tag: third-party image runs privileged with read-write checkout.
      # New release: pull tag once, read
      # `docker inspect --format '{{index .RepoDigests 0}}'`, add line.
      - name: Resolve the SDK image
        run: |
          [[ $SFOS =~ ^[0-9]+(\.[0-9]+){3}$ ]] || {
            echo "::error::sfos_version '$SFOS' is not a dotted version"; exit 1; }
          case "$SFOS" in
            5.2.0.15) digest=sha256:e7c4379393b17ee63d7f7443ce9930c315a61fdb2e732016346ccbe8c934435e ;;
            *) echo "::error::no pinned digest for coderus/sailfishos-platform-sdk:$SFOS; add one to rpm.yml"
               exit 1 ;;
          esac
          echo "IMAGE=coderus/sailfishos-platform-sdk@$digest" >> "$GITHUB_ENV"

      - name: Pull the Sailfish SDK
        run: docker pull "$IMAGE"

      # TEMPORARY (#38 investigation, reverted next commit): show Silica's DockedPanel.
      - name: Dump Silica DockedPanel
        continue-on-error: true
        run: |
          docker run --rm --privileged "$IMAGE" /bin/bash -c '
            t=$(sb2-config -l | grep -- "-aarch64$" | tail -1)
            root=$(sb2 -t "$t" -m sdk-install -R sh -c "echo /" >/dev/null 2>&1; echo /srv/mer/targets/$t)
            f=$(find "$root" /srv -name DockedPanel.qml 2>/dev/null | head -1)
            if [ -z "$f" ]; then
              sb2 -t "$t" -m sdk-install -R zypper --non-interactive in sailfishsilica-qt5 >/dev/null 2>&1 || true
              f=$(find / -name DockedPanel.qml 2>/dev/null | head -1)
            fi
            echo "FILE=$f"
            d=$(dirname "$f")
            echo "=== DockedPanel.qml"; cat "$f"
            for n in $(grep -oE "\b(Private\.)?[A-Z][A-Za-z]*(Panel|Dimmer|Mouse[A-Za-z]*|Shade|Modal)[A-Za-z]*\b" "$f" | sort -u | sed "s/^Private\.//"); do
              for g in $(find "$d" -name "$n.qml" 2>/dev/null); do echo "=== $g"; cat "$g"; done
            done
            echo "=== grep modal"; grep -rln "modal" "$d" | head -30'

      # Ask image for target, don't assume: odd naming fails here with list, not in rpmbuild.
      - name: Resolve the build target
        run: |
          targets=$(docker run --rm "$IMAGE" sb2-config -l 2>/dev/null || true)
          echo "available targets:"; echo "$targets"
          target=$(echo "$targets" | grep -- "-$ARCH\$" | tail -1)
          if [ -z "$target" ]; then
            echo "::error::no $ARCH target in the $SFOS SDK image; see the list above"
            exit 1
          fi
          echo "Building against $target"
          echo "TARGET=$target" >> "$GITHUB_ENV"

      # sdk-manage refuses root: build as image user, checkout owned by it, mounted
      # in its home. scratchbox2 rpm maps unknown absolute paths into target rootfs,
      # so tree at /build would be written outside, read inside.
      - name: Hand the checkout to the SDK's build user
        run: |
          uid=$(docker run --rm "$IMAGE" id -u)
          gid=$(docker run --rm "$IMAGE" id -g)
          home=$(docker run --rm "$IMAGE" sh -c 'echo $HOME')
          echo "SDK builds as uid=$uid gid=$gid, HOME=$home"
          echo "BUILDDIR=$home/harbour-salama" >> "$GITHUB_ENV"
          sudo chown -R "$uid:$gid" "$PWD"

      # `-X`: else build-init asks `git describe`, finds no tag, never writes
      # .mb2/spec. build-requires pulls BuildRequires from Jolla repos. Parallel make.
      - name: Build the RPM
        run: |
          docker run --rm --privileged \
            -e TARGET \
            -v "$PWD:$BUILDDIR" -w "$BUILDDIR" \
            "$IMAGE" \
            /bin/bash -c 'set -e
              mb2 -t "$TARGET" -X build-init
              mb2 -t "$TARGET" -X build-requires ||
                echo "::warning::mb2 build-requires failed; the build may stop on a missing BuildRequires"
              mb2 -t "$TARGET" -X build --no-check'

      - name: Show mb2's state
        if: failure()
        run: ls -la .mb2 2>/dev/null || true; tail -60 .mb2/*.log 2>/dev/null || true

      - name: Take the tree back
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" "$PWD"

      - name: Install rpm tooling on the runner
        run: ci/apt-install.sh binutils rpm rpm2cpio cpio file

      - name: Show what was built
        run: find RPMS -name '*.rpm' -print -exec rpm -qip {} \;

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: harbour-salama-${{ env.ARCH }}-sfos${{ env.SFOS }}-${{ env.SHORT_SHA }}
          path: RPMS/**/*.rpm
          if-no-files-found: error
          retention-days: 30

      # Authority. Only built package shows generated Requires/Provides, stripped
      # symbols, real file modes. After upload on purpose: rejected package still
      # useful on phone.
      - name: Validate the RPM against Harbour's rules
        run: |
          rpm=$(find RPMS -name 'harbour-salama-*.rpm' ! -name '*debug*' ! -name '*.src.rpm' | head -1)
          [ -n "$rpm" ] || { echo "::error::no RPM to validate"; exit 1; }
          echo "Validating $rpm"
          ci/harbour-validate-rpm.sh "$rpm"

  # Release: built package on GitHub release v<version>, text = version's
  # docs/CHANGELOG.md section. Own job so `contents: write` never reaches privileged
  # third-party SDK build. Needs build, which ends with validator: rejected package gets
  # no release.
  #
  # `v*` tag: tag exists, `--verify-tag` won't invent one. Dispatch: release creates tag
  # on checked-out commit, so tag, release, RPM = one commit. Existing release is added
  # to, so re-run finishes after transient failure. Runner's own `gh`, job token.
  release:
    name: GitHub release
    needs: rpm
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE: ${{ inputs.release || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch the package this run built
        run: gh run download "$GITHUB_RUN_ID" --dir rpms

      # Device RPM + checksum only; debug/source RPMs are for developers.
      - name: Gather the assets
        run: |
          mkdir -p assets
          find rpms -name 'harbour-salama-*.rpm' ! -name '*debug*' \
               ! -name '*.src.rpm' -exec cp {} assets/ \;
          [ -n "$(ls assets)" ] || { echo "::error::no device RPM to release"; exit 1; }
          (cd assets && sha256sum -- * > SHA256SUMS)
          cat assets/SHA256SUMS

      - name: Publish the release
        run: |
          if [ -n "$RELEASE" ]; then
            version=$RELEASE
            where=(--target "$GITHUB_SHA")
          else
            version=${GITHUB_REF_NAME#v}
            where=(--verify-tag)
          fi
          ci/release-notes.sh "$version" > notes.md
          if gh release view "v$version" >/dev/null 2>&1; then
            gh release upload "v$version" assets/* --clobber
          else
            gh release create "v$version" "${where[@]}" \
              --title "salama $version" \
              --notes-file notes.md \
              assets/*
          fi
