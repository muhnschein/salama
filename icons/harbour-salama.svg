<?xml version="1.0" encoding="UTF-8"?>
<!-- salama ("lightning"): yellow bolt, hard offset shadow, indigo Sailfish drop. Flat: no blur, no outline. Rendered to PNG by icons/render.sh, which also reads bolt's points for cover halftone. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="86" height="86" viewBox="0 0 86 86">
  <defs>
    <linearGradient id="ground" x1="10" y1="80" x2="80" y2="4" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2a1fa8"/>
      <stop offset="0.5" stop-color="#4a35d8"/>
      <stop offset="1" stop-color="#7a5cf5"/>
    </linearGradient>
    <linearGradient id="spark" x1="28" y1="78" x2="58" y2="8" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff8a2e"/>
      <stop offset="0.5" stop-color="#ffc22e"/>
      <stop offset="1" stop-color="#ffe85c"/>
    </linearGradient>
    <clipPath id="drop">
      <path d="M43 .3H84.28A1.42 1.42 0 0 1 85.7 1.72V43A42.7 42.7 0 1 1 43 .3Z"/>
    </clipPath>
  </defs>
  <g clip-path="url(#drop)">
    <rect width="86" height="86" fill="url(#ground)"/>
    <use xlink:href="#bolt" transform="translate(2.4 3.2)" fill="#160e70" stroke="#160e70" opacity="0.5"/>
    <use xlink:href="#bolt" fill="url(#spark)" stroke="url(#spark)"/>
  </g>
  <defs>
    <polygon id="bolt" points="51 15 24.6 48.6 42.2 48.6 35 71 61.4 37.4 43.8 37.4" stroke-width="3.2" stroke-linejoin="round"/>
  </defs>
</svg>
