# What SonarQube Cloud is told about this project, read by the scanner
# .github/workflows/sonar.yml runs.
#
# It is a REPORT, not a gate (SCOPE.md §7): `make check` and ci.yml decide what
# is allowed in, and nothing here can turn a red build green or a green build
# red. Coverage and the compilation database are produced by
# `make sonar-reports` rather than by the scanner itself; the reasons are with
# the properties below.
# The SonarCloud project keeps its original key until it is renamed there; the
# repository and package are salama.
sonar.projectKey=muhnschein_salama
sonar.organization=muhnschein
sonar.projectName=salama

# sonar.projectVersion is deliberately NOT set. rpm/harbour-salama.spec carries
# the placeholder 0.0.0 and CI stamps the release tag over it
# (docs/RELEASING.md), so the only honest version lives in the tag. A copy here
# would be a second thing to forget, and would report 0.0.0 for every build.

sonar.sourceEncoding=UTF-8

# The whole tree, minus the exclusions below, rather than a list of source
# directories: the secrets detector runs over files no language analyser claims
# -- the spec file, the desktop entry, the shell scripts under ci/ -- and those
# are exactly the files a token gets pasted into.
sonar.sources=.

# Test code, separated so that coverage and duplication are measured on the
# application and not on its fixtures. tests/silica-stubs is where
# near-identical code is supposed to live: the stubs imitate one Silica
# component each.
#
# A file may not be in both sets, so tests/ appears in sonar.exclusions as
# well. The scanner's complaint when it does not is "File X can't be indexed
# twice".
sonar.tests=tests

sonar.exclusions=\
    build/**,\
    build-*/**,\
    tests/**,\
    translations/**,\
    icons/**,\
    third_party/**,\
    **/*.png

# What is in the tree but is not this project's to answer for:
#
# build/ is whatever CMake left, including the compilation database and the
# coverage report this same scan imports. translations/ is generated by
# lupdate, and its files are the reason that line is not optional: a Qt
# catalogue is named .ts, so the scanner would index them as TypeScript. They
# are XML. Near-identical XML, at that, which is duplication measured on a
# machine's output. icons/ is rendered artwork, and the PNGs cost a scan each
# and print "Invalid character encountered ... for encoding UTF-8" on every
# run -- lines of warning that mean nothing and train the reader to skim.
#
# ci/harbour/*.conf is deliberately NOT excluded. Those files are Jolla's
# allow-lists copied verbatim (docs/HARBOUR.md), no analyser claims them, and
# leaving them indexed keeps them in front of the secrets detector for free.

# Binary fixtures inside the test tree; sonar.exclusions governs main sources
# only and does not reach it.
sonar.test.exclusions=**/*.png

# --- C++ ----------------------------------------------------------------
#
# The C/C++ analyser needs to know how each file is compiled. CMake writes that
# out already -- CMakeLists.txt sets CMAKE_EXPORT_COMPILE_COMMANDS -- so the
# database is handed over rather than reconstructed with a build wrapper.
# `make sonar-reports` is what puts it there, and it is the same build
# `make check` runs, not a second one configured differently.
sonar.cfamily.compile-commands=build/compile_commands.json

# Coverage, from gcovr's SonarQube generic format, written by the same target.
#
# The scanner never measures coverage; it only imports a report. Without this
# and the target that writes it the reading is a confident 0.0% rather than "no
# data" -- which is exactly what this project read for as long as analysis ran
# server-side, where no report can be produced at all. An absent report is a
# warning in the scanner log, not a failure, so a run that skipped it degrades
# to "no coverage data" rather than breaking.
sonar.coverageReportPaths=build/coverage/sonar-coverage.xml

# src/main.cpp is excluded from coverage and not from analysis: its issues
# still count. It is the process entry point -- it builds a QGuiApplication, a
# QQuickView and the engine, none of which a host test can stand up -- and
# `make coverage` excludes it for the same reason. Left in, the 80% floor would
# be measured partly against lines no host test can reach.
sonar.coverage.exclusions=src/main.cpp

# qml/ needs no coverage exclusion: SonarQube has no QML analyser and there are
# no .js files beside the .qml, so nothing under it is indexed as coverable in
# the first place. The QML rules this project does enforce are in
# ci/qml-lint.sh and the static tests, which run in `make check`.
