# SonarQube Cloud project config, read by scanner in .github/workflows/sonar.yml.
#
# REPORT, not gate (SCOPE.md §6). Coverage and compile DB from `make sonar-reports`;
# reasons below.
# SonarCloud project keeps original key until renamed there; repo and package are salama.
sonar.projectKey=muhnschein_salama
sonar.organization=muhnschein
sonar.projectName=salama

# sonar.projectVersion NOT set: version lives in rpm/harbour-salama.spec
# (docs/RELEASING.md); packaging-lint keeps CMake in sync. sonar.yml reads spec, passes
# -Dsonar.projectVersion.

sonar.sourceEncoding=UTF-8

# Whole tree minus exclusions, not source dir list: secrets detector covers files no
# analyser claims (spec, desktop entry, ci/ scripts), where tokens get pasted.
sonar.sources=.

# Test code, so coverage and duplication measure app, not fixtures.
# tests/silica-stubs is near-identical by design (one Silica component each).
#
# File can't be in both sets, so tests/ also in sonar.exclusions ("File X can't be
# indexed twice").
sonar.tests=tests

sonar.exclusions=\
    build/**,\
    build-*/**,\
    tests/**,\
    translations/**,\
    icons/**,\
    third_party/**,\
    **/*.png

# Not ours to answer for:
#
# build/: CMake output, incl. DB and coverage report this scan imports.
# translations/: lupdate output; Qt .ts would be indexed as TypeScript. It's XML,
# near-identical, generated.
# icons/: rendered art; PNGs cost scan time and spam encoding warnings.
#
# ci/harbour/*.conf kept indexed on purpose: Jolla's allow-lists, verbatim
# (docs/HARBOUR.md), no analyser claims them, secrets detector still scans.

# Binary fixtures in test tree; sonar.exclusions covers main sources only.
sonar.test.exclusions=**/*.png

# --- C++ ----------------------------------------------------------------
#
# Analyser needs compile flags. CMake writes DB (CMAKE_EXPORT_COMPILE_COMMANDS), handed
# over, no build wrapper. `make sonar-reports` = same build as `make check`.
sonar.cfamily.compile-commands=build/compile_commands.json

# Coverage: gcovr SonarQube generic format, same target.
# Scanner never measures, only imports. No report = confident 0.0%, not "no data".
# Absent report = scanner warning, not failure.
sonar.coverageReportPaths=build/coverage/sonar-coverage.xml

# src/main.cpp: excluded from coverage, not analysis. Entry point builds QGuiApplication,
# QQuickView, engine; no host test can. `make coverage` excludes it too.
sonar.coverage.exclusions=src/main.cpp

# qml/ needs no coverage exclusion: no QML analyser, no .js beside .qml. QML rules live
# in ci/qml-lint.sh and static tests.
